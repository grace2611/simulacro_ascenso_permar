<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulacro Marina · Centro de estudio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem("simulacro_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/hub.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/cuenta.css">
  <link rel="stylesheet" href="css/orden.css">
</head>

<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>

<div class="page">

  <main class="main-container">

    <div class="hub-top">
      <div>
        <span class="subtittle">Cuestionarios ascenso PERMAR</span>
        <h1 class="tittle">SIMULACRO ASCENSO PERMAR 2026</h1>
      </div>
    </div>

    <div id="welcome" class="welcome" hidden></div>
    <section id="today" class="today" aria-label="Tu día de estudio" hidden></section>

    <section class="hub-section" aria-labelledby="hModos">
      <h2 id="hModos">¿Qué quieres hacer hoy?</h2>
      <div class="modes" id="modes"></div>
    </section>

    <section class="hub-section" aria-labelledby="hCats">
      <h2 id="hCats">Práctica por categoría (100 preguntas · fases de 25)</h2>
      <div class="cards" id="cats"></div>
    </section>

    <div class="btnrow" style="justify-content:center">
      <button type="button" class="btn btn-secondary" id="settingsBtn">⚙️ Ajustes y objetivo diario</button>
    </div>

  </main>

</div>

<script src="js/app/site-config.js"></script>
<script type="module" src="js/app/boot.js" data-page="index"></script>

</body>
</html>
