<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Desafíos y medallas · Simulacro PERMAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem("simulacro_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/progreso.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/cuenta.css">
  <link rel="stylesheet" href="css/orden.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>

<div class="container">
  <a class="backlink" href="index.html">← Centro de estudio</a>
  <h1><span class="h1-icon" aria-hidden="true">🏆</span> <span class="h1-text">DESAFÍOS Y MEDALLAS</span></h1>

  <section class="panel glass" aria-labelledby="hNivel">
    <h2 id="hNivel">Tu nivel</h2>
    <div id="level"></div>
  </section>

  <section class="panel glass" aria-labelledby="hMeta">
    <h2 id="hMeta">Objetivo de hoy y racha</h2>
    <div id="daily"></div>
  </section>

  <section class="panel glass" aria-labelledby="hSem">
    <h2 id="hSem">Desafíos de esta semana</h2>
    <div class="grid2" id="weekly"></div>
  </section>

  <section class="panel glass" aria-labelledby="hMed">
    <h2 id="hMed">Medallas</h2>
    <p class="hint" id="medalCount"></p>
    <div class="badges" id="badges"></div>
  </section>
</div>

<script src="js/app/site-config.js"></script>
<script type="module" src="js/app/boot.js" data-page="desafios"></script>

</body>
</html>
