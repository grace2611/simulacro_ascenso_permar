<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjetas de memoria · Simulacro PERMAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem("simulacro_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>

<div class="container">

  <a class="backlink" href="index.html">← Centro de estudio</a>
  <h1 id="titulo">🃏 Tarjetas de memoria</h1>

  <section id="setupView" class="panel glass"></section>

  <section id="sessionView" hidden>
    <div class="info">
      <p id="progreso"></p>
      <p id="contador"></p>
      <p id="xpSesion" class="chip-xp">+0 XP</p>
    </div>
    <div class="progress-container"><div class="progress-bar" id="barra"></div></div>

    <div class="cardscene">
      <button type="button" class="flashcard" id="flash" aria-pressed="false">
        <span class="flash-inner">
          <span class="face front">
            <span class="chip" id="fcat"></span>
            <span class="fq" id="fq"></span>
            <span class="fhint" id="fhint">Pulsa la tarjeta para ver la respuesta</span>
          </span>
          <span class="face back" aria-hidden="true">
            <span class="flabel">Respuesta correcta</span>
            <span class="fa" id="fa"></span>
            <span class="fstate" id="fstate"></span>
          </span>
        </span>
      </button>
    </div>
    <p id="live" class="sr-only" aria-live="polite"></p>

    <div id="expText" class="expbox" hidden></div>

    <div class="ratebar" role="group" aria-label="¿Cómo te fue?">
      <button type="button" class="btn rate good" data-r="r" disabled>😊 Lo recordé <kbd>1</kbd></button>
      <button type="button" class="btn rate doubt" data-r="d" disabled>🤔 Tuve dudas <kbd>2</kbd></button>
      <button type="button" class="btn rate bad" data-r="n" disabled>😟 No lo recordé <kbd>3</kbd></button>
    </div>

    <div class="sessionbar">
      <button type="button" class="btn btn-secondary" id="prevBtn" disabled>← Anterior</button>
      <button type="button" class="btn btn-secondary" id="revealBtn">👁 Revelar respuesta</button>
      <button type="button" class="btn btn-secondary" id="expBtn" hidden>📖 Explicación y fuente</button>
      <button type="button" class="btn btn-danger" id="finishBtn">⏹ Terminar</button>
    </div>
  </section>

  <section id="summaryView" class="panel glass summary" hidden></section>

</div>

<script src="js/data/cultura.js"></script>
<script src="js/data/deberes.js"></script>
<script src="js/data/oficinista.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/srs.js"></script>
<script src="js/core/gamify.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/pages/tarjetas.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
