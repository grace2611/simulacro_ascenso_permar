<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Leer preguntas y respuestas · Simulacro PERMAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem("simulacro_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/leer.css">
</head>

<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>

<div class="container">

  <a class="backlink" href="index.html">← Centro de estudio</a>
  <h1><span class="h1-icon" aria-hidden="true">📖</span> <span class="h1-text">LEER PREGUNTAS Y RESPUESTAS</span></h1>

  <section class="panel glass leer-tools" aria-label="Filtros">
    <p class="hint">Lee todo el banco con la respuesta correcta resaltada antes de empezar tu repaso. Esta pantalla es solo de lectura: no registra respuestas, XP ni progreso.</p>

    <div class="leer-tabs" id="tabs" role="tablist" aria-label="Categoría"></div>
    <div id="espHint"></div>

    <div class="leer-row">
      <label class="sr-only" for="buscar">Buscar</label>
      <input type="search" id="buscar" placeholder="🔍 Buscar una palabra…" autocomplete="off">
      <label class="check"><input type="checkbox" id="soloResp"> <span>Mostrar solo la respuesta correcta</span></label>
    </div>
    <p class="hint" id="contador" role="status" aria-live="polite"></p>
  </section>

  <section id="lista" class="leer-list" aria-label="Preguntas"></section>

  <div class="btnline">
    <a class="btn btn-primary" href="estudio.html?modo=rapida&min=5">⏱️ Empezar a practicar</a>
    <a class="btn btn-secondary" href="tarjetas.html">🃏 Ir a las tarjetas</a>
  </div>

  <button type="button" class="leer-top" id="topBtn" aria-label="Volver arriba" hidden>↑</button>
</div>

<script src="js/data/cultura.js"></script>
<script src="js/data/deberes.js"></script>
<script src="js/data/especialidades.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/srs.js"></script>
<script src="js/core/gamify.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/pages/leer.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
